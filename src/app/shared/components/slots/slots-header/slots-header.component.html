<header class="slots-header">
  <div class="slots-header__topline"></div>

  <div class="slots-header__inner">
    <div class="slots-header__logo">
      <div class="logo-pillar"></div>

      <div class="logo-content">
        <div class="logo-icon">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="20" r="18" fill="url(#goldGrad)" stroke="#c8860a" stroke-width="1.5"/>
            <circle cx="20" cy="20" r="13" fill="none" stroke="rgba(255,220,100,0.3)" stroke-width="1"/>
            <rect x="12" y="14" width="16" height="2.5" rx="1.25" fill="#3a0a0a"/>
            <rect x="12" y="18.75" width="16" height="2.5" rx="1.25" fill="#3a0a0a"/>
            <rect x="12" y="23.5" width="16" height="2.5" rx="1.25" fill="#3a0a0a"/>
            <text x="20" y="22" text-anchor="middle" font-size="10" fill="#3a0a0a">✦</text>
            <defs>
              <linearGradient id="goldGrad" x1="5" y1="5" x2="35" y2="35" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#ffe068"/>
                <stop offset="50%" stop-color="#f0b429"/>
                <stop offset="100%" stop-color="#c8860a"/>
              </linearGradient>
            </defs>
          </svg>
        </div>

        <div class="logo-text">
          <span class="logo-text__main">SLOTS</span>
          <span class="logo-text__sub">Lucky Spin</span>
        </div>
      </div>
    </div>
    <div class="slots-header__center">
      <div class="center-ornament">
        <span class="ornament-line"></span>
        <span class="ornament-diamond">◆</span>
        <span class="ornament-line"></span>
      </div>
    </div>

    <div class="slots-header__right">
      <div class="balance-box">
        <div class="balance-box__icon">
          <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" width="16" height="16">
            <rect x="2" y="5" width="16" height="11" rx="2" stroke="#f0b429" stroke-width="1.5"/>
            <path d="M6 5V4a4 4 0 018 0v1" stroke="#f0b429" stroke-width="1.5"/>
            <circle cx="10" cy="11" r="2" fill="#f0b429"/>
          </svg>
        </div>
        <div class="balance-box__info">
          <span class="balance-box__label">BALANCE</span>
          <span class="balance-box__value">{{ formatCurrency(balance) }}</span>
        </div>
      </div>

      <div class="menu-wrap">
        <button class="menu-btn" (click)="toggleMenu()" [class.menu-btn--open]="isMenuOpen" aria-label="Menu">
          <span class="menu-btn__bar"></span>
          <span class="menu-btn__bar"></span>
          <span class="menu-btn__bar"></span>
        </button>

        <div class="menu-dropdown" [class.menu-dropdown--visible]="isMenuOpen">
          <div class="menu-dropdown__header">
            <span class="menu-dropdown__title">Menu</span>
            <button class="menu-dropdown__close" (click)="closeMenu()">✕</button>
          </div>
          <nav class="menu-dropdown__nav">
            <a *ngFor="let item of menuItems" class="menu-dropdown__item" (click)="closeMenu()">
              <span class="menu-item__icon">{{ item.icon }}</span>
              <span class="menu-item__label">{{ item.label }}</span>
              <span class="menu-item__arrow">›</span>
            </a>
          </nav>
        </div>
        <div *ngIf="isMenuOpen" class="menu-backdrop" (click)="closeMenu()"></div>
      </div>

    </div>
  </div>
  <div class="slots-header__bottomline"></div>
</header>
